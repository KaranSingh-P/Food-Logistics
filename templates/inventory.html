<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Logistics | Inventory</title>
    <link rel="stylesheet" href="../static/css/App-css/navbar.css">
    <link rel="stylesheet" href="../static/css/App-css/Horizontal-tools.css">
    <link rel="stylesheet" href="../static/css/App-css/inventory-table.css">
    <link rel="stylesheet" href="../static/css/App-css/inventory-navigation.css">
</head>

<body>
    <header>
        <div class="navbar">
            <div class="v-navbar">
                <button id="hamburger">☰</button>
                <span class="navbar-title">Food Logistics</span>
                <a href="/nutrition-tracker" class="switch-link">
                    Switch to Nutrition Tracker →
                </a>
            </div>
            <div class="account">
                <a href="/user-settings" id="navbar-email-id">
                    {{ navbar_username }}
                </a>
                <a href="{{ url_for('auth.logout') }}" class="logout-link">
                    Log Out
                </a>
            </div>
        </div>
        <div class="navbar-spacer"></div>
    </header>

    <nav id="menu" style="display: none;">
        <a href="dashboard">Dashboard</a>
        <a href="">Inventory</a>
        <a href="recipe-generation">Recipe Generation</a>
        <a href="shopping-list">Shopping List Generation</a>
    </nav>

    <section class="vertical-tools">
        <div class="insert-item">
            <form action="">
                <input type="text" placeholder="Insert the food item here" id="type-item">

                <div class="item-suggestion">
                    <button id="">Suggestion 1</button>
                    <button id="">Suggestion 2</button>
                    <button id="">Suggestion 3</button>
                </div>
            </form>

            <div class="item-details">
                <form action="" class="select-item-tag">
                    <select name="" id="">
                        <option value="" selected>Select the Type of food</option>
                        <option value="perishable">Perishable</option>
                        <option value="highly-perishable">Highly perishable</option>
                        <option value="semi-perishable">Semi-perishable</option>
                        <option value="non-perishable">Non-perishable</option>
                        <option value="canned">Canned</option>
                        <option value="frozen">Frozen</option>
                        <option value="dehydrated">Dehydrated</option>
                        <option value="fermented">Fermented</option>
                    </select>
                </form>
                <form action="" class="add-item-date">
                    <label for="">Date of Purchase: </label>
                    <input type="date" name="" id="item-date">
                </form>
                <form action="" class="add-item-form">
                    <button type="submit" id="add-item-button">ADD ITEM</button>
                </form>
            </div>
            <button id="automatic-insert"><i class="fa-regular fa-camera"></i></button>
    </section>

    <section class="navivation">
        <nav class="pagination" id="paginationTop" aria-label="Pagination">
        </nav>
    </section>


    <main class="inventory-table">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>S.No</b></th>
                        <th>Name</th>
                        <th>Tag</th>
                        <th>Date of Purchase / Manufacture</th>
                        <th>Date of Expiration</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="inventoryTableBody">
                </tbody>
            </table>
        </div>
    </main>

    <section class="navivation">
        <nav class="pagination" id="paginationBottom" aria-label="Pagination">
        </nav>
    </section>



    <script src="../static/javascript/app.js"></script>
    <script src="{{ url_for('static', filename='javascript/inventory.js') }}"></script>
    <script src="https://kit.fontawesome.com/29c59c4f0c.js" crossorigin="anonymous"></script>
</body>

</html>
