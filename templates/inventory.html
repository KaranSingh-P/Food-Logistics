<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Logistics | Inventory</title>
    <link rel="stylesheet" href="../static/css/App-css/navbar.css">
    <link rel="stylesheet" href="../static/css/App-css/inventory.css">
</head>

<body>
    <header>
        <div class="navbar">
            <div class="v-navbar">
                <button id="hamburger">☰</button>
                <span class="navbar-title">Food Logistics</span>
                <a href="/nutrition-tracker" class="switch-link">
                    Switch to Nutrition Tracker →
                </a>
            </div>
            <div class="account">
                <a href="{{ url_for('settings.user_settings_page') }}" id="navbar-email-id">
                    {{ navbar_username }}
                </a>
                <a href="{{ url_for('auth.logout') }}" class="logout-link">
                    Log Out
                </a>
            </div>
        </div>
        <div class="navbar-spacer"></div>
    </header>

    <nav id="menu" style="display: none;">
        <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('inventory.inventory') }}">Inventory</a>
        <a href="{{ url_for('recipes.recipe_generation') }}">Recipe Generation</a>
        <a href="{{ url_for('shopping.shopping_list') }}">Shopping List Generation</a>
    </nav>


    <section class="vertical-tools">
        <div class="insert-item">
            <form id="add-item-form">
                <input type="text" placeholder="Insert the food item here" id="type-item" name="item_name"
                    autocomplete="off" minlength="3" required>
                <div class="item-suggestion" id="item-suggestions">
                </div>

                <div class="item-details">
                    <div class="select-item-tag">
                        <select name="category" id="item-category" required>
                            <option value="" selected disabled>
                                Select the Type of food
                            </option>
                            <option value="perishable">Perishable</option>
                            <option value="highly-perishable">Highly perishable</option>
                            <option value="semi-perishable">Semi-perishable</option>
                            <option value="non-perishable">Non-perishable</option>
                            <option value="canned">Canned</option>
                            <option value="frozen">Frozen</option>
                            <option value="dehydrated">Dehydrated</option>
                            <option value="fermented">Fermented</option>
                        </select>
                    </div>
                    <div class="add-item-date">
                        <label for="item-date">
                            Date of Purchase:
                        </label>
                        <input type="date" name="purchase_date" id="item-date" required>
                        <button type="button" id="purchase-today">
                            Today
                        </button>
                    </div>
                    <div class="add-item-expiry">
                        <label for="item-expiry">
                            Expiration Date:
                        </label>
                        <input type="date" name="expiration_date" id="item-expiry" required>
                        <div class="expiry-shortcuts">
                            <button type="button" data-days="7">Add 7 days</button>
                            <button type="button" data-days="30">Add 30 days</button>
                            <button type="button" data-days="90">Add 90 days</button>
                        </div>
                    </div>
                    <button type="submit" id="add-item-button">
                        ADD ITEM
                    </button>
                </div>
                <div id="item-feedback"></div>
            </form>
            <button type="button" id="automatic-insert">
                <i class="fa-regular fa-camera"></i>
            </button>
        </div>
    </section>


    <section class="navivation">
        <nav class="pagination" id="paginationTop" aria-label="Pagination">
        </nav>
    </section>


    <main class="inventory-table">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>
                            <button type="button" class="sort-header" id="sort-id">
                                S.No. <span class="sort-arrow">↑</span>
                            </button>
                        </th>
                        <th>
                            <button type="button" class="sort-header" id="sort-name">
                                Name <span class="sort-arrow"></span>
                            </button>
                        </th>
                        <th>Tag</th>
                        <th>Date of Purchase / Manufacture</th>
                        <th>
                            <button type="button" class="sort-header" id="sort-expiration">
                                Date of Expiration <span class="sort-arrow"></span>
                            </button>
                        </th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="inventoryTableBody">
                </tbody>
            </table>
        </div>
    </main>

    <section class="navivation">
        <nav class="pagination" id="paginationBottom" aria-label="Pagination">
        </nav>
    </section>



    <script src="../static/javascript/app.js"></script>
    <script src="{{ url_for('static', filename='javascript/inventory.js') }}"></script>
    <script src="https://kit.fontawesome.com/29c59c4f0c.js" crossorigin="anonymous"></script>
</body>

</html>
